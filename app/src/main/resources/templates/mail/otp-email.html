<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Intelligence OTP</title>
</head>
<body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f7fb;padding:32px 16px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;">
                    <tr>
                        <td style="background:#0f766e;padding:28px 32px;color:#ffffff;">
                            <div style="font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.9;">Stock Intelligence</div>
                            <h1 style="margin:8px 0 0;font-size:24px;line-height:1.3;font-weight:700;">Verify your email</h1>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:32px;">
                            <p style="margin:0 0 14px;font-size:16px;line-height:1.6;">Hello,</p>
                            <p style="margin:0 0 22px;font-size:16px;line-height:1.6;">
                                Use the verification code below to
                                <span th:text="${action == 'register' ? 'finish creating your account' : 'sign in to your account'}">continue</span>
                                for <strong th:text="${email}">user@example.com</strong>.
                            </p>
                            <div style="margin:24px 0;padding:22px;border-radius:10px;background:#ecfdf5;border:1px solid #99f6e4;text-align:center;">
                                <div style="font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#0f766e;font-weight:700;">Your OTP</div>
                                <div style="margin-top:10px;font-size:38px;letter-spacing:.28em;font-weight:800;color:#064e3b;" th:text="${otp}">123456</div>
                            </div>
                            <p style="margin:0 0 18px;font-size:14px;line-height:1.6;color:#4b5563;">
                                This code expires in <strong th:text="${expiresInMinutes}">5</strong> minutes.
                            </p>
                            <p style="margin:0;font-size:14px;line-height:1.6;color:#6b7280;">
                                If you did not request this email, you can safely ignore it.
                            </p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:20px 32px;background:#f9fafb;border-top:1px solid #e5e7eb;">
                            <p style="margin:0;font-size:12px;line-height:1.5;color:#6b7280;">
                                This is an automated message from Stock Intelligence.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
